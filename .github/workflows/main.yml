name: Build Pixel 7a LineageOS Docker Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential libelf-dev clang lld llvm git gnupg flex libssl-dev libncurses-dev wget curl

      - name: Download Clang Toolchain (AOSP Clang)
        run: |
          mkdir -p toolchain
          cd toolchain
          # Download Android Clang toolchain used for building kernel 5.10
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-build-2023/clang-r487747c.tar.gz
          tar -xzf clang-r487747c.tar.gz
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Clone LineageOS gs201 Kernel Source
        run: |
          # Clone the specific repository for Pixel 7a kernel (gs201)
          git clone --depth=1 https://github.com/LineageOS/android_kernel_google_gs201.git -b lineage-21 kernel-source

      - name: Apply Docker Configuration Fragment
        run: |
          # Apply Docker configs directly to the default gki defconfig
          cat docker_kernel_config.fragment >> kernel-source/arch/arm64/configs/gki_defconfig

      - name: Compile Kernel
        run: |
          cd kernel-source
          # Set up build variables
          export PATH=$PATH
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC=clang LD=ld.lld gki_defconfig
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC=clang LD=ld.lld

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-docker
          path: kernel-source/arch/arm64/boot/Image
